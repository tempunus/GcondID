{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Relatorios</h1>
<div class="row g-3">
  <div class="col-md-6 col-xl-4"><div class="content-card p-3 h-100"><h2 class="h5">Estoque por setor</h2><form class="vstack gap-2" method="get"><select class="form-select" name="sector">{% for value,label in sectors %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><button class="btn btn-outline-light" formaction="{% url 'relatorios:pdf' 'estoque' %}">PDF</button><button class="btn btn-primary" formaction="{% url 'relatorios:excel' 'estoque' %}">Excel</button></form></div></div>
  <div class="col-md-6 col-xl-4"><div class="content-card p-3 h-100"><h2 class="h5">Estoque critico</h2><a class="btn btn-outline-light me-2" href="{% url 'relatorios:pdf' 'critico' %}">PDF</a><a class="btn btn-primary" href="{% url 'relatorios:excel' 'critico' %}">Excel</a></div></div>
  <div class="col-md-6 col-xl-4"><div class="content-card p-3 h-100"><h2 class="h5">Movimentacao de estoque</h2><form class="vstack gap-2" method="get"><input class="form-control" type="date" name="start"><input class="form-control" type="date" name="end"><button class="btn btn-outline-light" formaction="{% url 'relatorios:pdf' 'movimentacoes' %}">PDF</button><button class="btn btn-primary" formaction="{% url 'relatorios:excel' 'movimentacoes' %}">Excel</button></form></div></div>
  <div class="col-md-6 col-xl-4"><div class="content-card p-3 h-100"><h2 class="h5">Chamados por status/setor/tecnico</h2><form class="vstack gap-2" method="get"><select class="form-select" name="status"><option value="">Todos os status</option>{% for value,label in ticket_statuses %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><select class="form-select" name="sector"><option value="">Todos os setores</option>{% for value,label in ticket_sectors %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><select class="form-select" name="technician"><option value="">Todos os tecnicos</option>{% for technician in technicians %}<option value="{{ technician.id }}">{{ technician.email }}</option>{% endfor %}</select><button class="btn btn-outline-light" formaction="{% url 'relatorios:pdf' 'chamados' %}">PDF</button><button class="btn btn-primary" formaction="{% url 'relatorios:excel' 'chamados' %}">Excel</button></form></div></div>
  <div class="col-md-6 col-xl-4"><div class="content-card p-3 h-100"><h2 class="h5">Usuarios cadastrados</h2><a class="btn btn-outline-light me-2" href="{% url 'relatorios:pdf' 'usuarios' %}">PDF</a><a class="btn btn-primary" href="{% url 'relatorios:excel' 'usuarios' %}">Excel</a></div></div>
</div>
{% endblock %}
