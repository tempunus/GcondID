{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GcondID</title>
    <script>document.documentElement.dataset.theme = localStorage.getItem("gcondid-theme") || "dark";</script>
    <link rel="manifest" href="{% static 'manifest.json' %}" />
    <meta name="theme-color" content="#f5b72e" />
    <link rel="apple-touch-icon" href="{% static 'img/landing-logo.png' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
  </head>
  <body class="landing-page">
    <main class="landing-shell" aria-label="GcondID">
      <img src="{% static 'img/landing-logo.png' %}" class="landing-logo" alt="GcondID - Gestao administrativa de condominios" />
      <a class="landing-enter" href="{% url 'login' %}">Entrar</a>
    </main>
    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/pwa.js' %}"></script>
  </body>
</html>
